<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phone Sword Controller</title>
  <meta name="theme-color" content="#07090f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Same design tokens as the game (styles.css :root) */
    :root {
      --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --font-display: 'Outfit', 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      --bg-0: #07090f;
      --surface-raised: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #f1f5f9;
      --text-muted: #9aa6b8;
      --accent: #fbbf24;
      --accent-ink: #1c1303;
      --accent-gradient: linear-gradient(180deg, #fcd34d 0%, #f5a524 100%);
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(700px 360px at 50% -10%, rgba(251, 191, 36, 0.14), transparent 62%),
        var(--bg-0);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }
    #status {
      font-size: 1rem;
      margin-bottom: 24px;
      min-height: 1.5em;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
      width: 100%;
      max-width: 320px;
    }
    #connect-btn {
      background: var(--accent-gradient);
      color: var(--accent-ink);
      border: none;
      border-radius: 14px;
      padding: 16px 48px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      margin-bottom: 24px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 8px 28px rgba(245,165,36,0.35);
    }
    #connect-btn:active { transform: scale(0.96); }
    #connect-btn:hover { filter: brightness(1.06); }
    #connect-btn:disabled { background: #334155; color: var(--text-muted); box-shadow: none; cursor: not-allowed; }
    #gyro-display {
      display: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.8;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 20px;
      width: 100%;
      max-width: 320px;
    }
    .connected-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: none;
    }
    #error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 16px;
      min-height: 1.4em;
    }
    .sword-icon {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      font-size: 3rem;
      margin-bottom: 20px;
      border-radius: 28px;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.45);
      box-shadow: 0 0 48px rgba(251, 191, 36, 0.2);
    }
    /* ── Controller layout (shown once connected) ─────────────────────── */
    body.controller-mode {
      justify-content: flex-start;
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      touch-action: none;
      overflow: hidden;
    }
    body.controller-mode .sword-icon,
    body.controller-mode h1,
    body.controller-mode .subtitle,
    body.controller-mode .connected-icon,
    body.controller-mode #gyro-display { display: none !important; }
    /* Everything centred on the middle of the screen: Block right in the middle, the joystick
       just below it (the equip buttons stacked to its left, Jump to its right), the other buttons just above it;
       the status pill sits on its own at the top */
    body.controller-mode #status {
      font-size: 0.85rem;
      padding: 6px 12px;
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      z-index: 1;
    }
    #controller {
      display: none;
      position: fixed;
      inset: 0;
      padding: 56px 16px;
      grid-template-rows: 1fr auto 1fr;
      justify-items: center;
      row-gap: 14px;
    }
    body.controller-mode #controller { display: grid; }
    #action-grid {
      align-self: end;
      width: min(100%, 380px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .ctl-btn {
      height: 68px;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      background: var(--surface-raised);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      touch-action: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: transform 0.08s, filter 0.08s;
    }
    .ctl-btn.pressed { transform: scale(0.94); filter: brightness(1.3); }
    .ctl-btn:disabled { opacity: 0.35; }
    .ctl-btn.equipped { outline: 3px solid var(--accent); outline-offset: -3px; }
    .ctl-btn.active { outline: 3px solid #7dd3fc; outline-offset: -3px; }
    /* Tutorial: the button the game is asking for */
    .tutorial-highlight { position: relative; animation: tutorial-ring 1s ease-in-out infinite; }
    @keyframes tutorial-ring {
      0%, 100% { box-shadow: 0 0 0 4px #facc15, 0 0 14px 4px rgba(250, 204, 21, 0.6); }
      50%      { box-shadow: 0 0 0 8px #facc15, 0 0 26px 10px rgba(250, 204, 21, 0.85); }
    }
    /* Same tints as the game's on-screen buttons */
    #btn-bomb   { background: rgba(234, 88, 12, 0.45); border-color: rgba(253, 186, 116, 0.6); }
    #btn-bubble { background: rgba(14, 165, 233, 0.4); border-color: rgba(186, 230, 253, 0.6); }
    #btn-jump   { background: rgba(99, 102, 241, 0.4); border-color: rgba(165, 180, 252, 0.6); }
    #btn-wand   { background: rgba(124, 58, 237, 0.45); border-color: rgba(216, 180, 254, 0.6); display: none; }
    #btn-wand.owned { display: block; }
    #joy-row {
      align-self: start;
      width: min(100%, 380px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    /* Equip buttons (gun / shield / wand, left) and Jump (right) beside the joystick */
    #joy-row .ctl-btn {
      width: 100%;
      max-width: 104px;
      padding: 4px;
      font-size: 0.95rem;
      line-height: 1.2;
    }
    #btn-jump { height: 84px; justify-self: center; }
    #equip-col {
      justify-self: center;
      width: 100%;
      max-width: 104px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #equip-col .ctl-btn { height: 50px; font-size: 0.9rem; }
    #joystick {
      position: relative;
      width: clamp(130px, 40vw, 160px);
      height: clamp(130px, 40vw, 160px);
      flex: 0 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 70%);
      border: 1px solid rgba(255,255,255,0.22);
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70px;
      height: 70px;
      margin: -35px 0 0 -35px;
      border-radius: 50%;
      background: rgba(241,245,249,0.7);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    #block-btn {
      width: min(100%, 380px);
      height: clamp(84px, 14vh, 120px);
      flex: 0 0 auto;
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      color: #fff;
      border: 1px solid rgba(147, 197, 253, 0.7);
      border-radius: 24px;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.45);
      transition: background 0.1s, transform 0.08s, box-shadow 0.1s;
      touch-action: none;
    }
    /* What the bar does with the weapon in hand: Fire (gun), Sword (shield), Shield (wand) */
    #block-btn.mode-fire {
      background: linear-gradient(180deg, #f59e0b, #c2410c);
      border-color: rgba(253, 230, 138, 0.8);
      box-shadow: 0 8px 32px rgba(234, 88, 12, 0.45);
    }
    #block-btn.mode-sword {
      background: linear-gradient(180deg, #64748b, #334155);
      border-color: rgba(203, 213, 225, 0.6);
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.5);
    }
    #block-btn.mode-shield {
      background: linear-gradient(180deg, #7c3aed, #4c1d95);
      border-color: rgba(216, 180, 254, 0.8);
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.45);
    }
    #block-btn.pressed { transform: scale(0.96); filter: brightness(1.3); }
    /* Classic mode: Block is the only control */
    /* (hidden but keeping their rows, so Block stays in the middle) */
    body.block-only #action-grid,
    body.block-only #joy-row { visibility: hidden; }
    body.block-only #block-btn { height: 190px; }
    #block-btn.blocking {
      background: linear-gradient(180deg, #10b981, #047857);
      border-color: rgba(167, 243, 208, 0.95);
      transform: scale(0.95);
      box-shadow: 0 2px 18px rgba(52, 211, 153, 0.7);
    }
  </style>
</head>
<body>
  <div class="sword-icon">⚔️</div>
  <h1>Phone Sword</h1>
  <p class="subtitle">Turn your phone into a sword controller</p>

  <div id="status">Tap Connect to start</div>
  <button id="connect-btn">Connect</button>
  <div class="connected-icon" id="connected-icon">🗡️</div>
  <div id="gyro-display">
    <div id="gyro-alpha">α (compass): —</div>
    <div id="gyro-beta">β (tilt fwd/back): —</div>
    <div id="gyro-gamma">γ (tilt left/right): —</div>
  </div>
  <div id="error-msg"></div>

  <div id="controller">
    <div id="action-grid">
      <button class="ctl-btn" id="btn-bomb" data-action="bomb">💣 0</button>
      <button class="ctl-btn" id="btn-bubble" data-action="bubble">🫧 0</button>
    </div>
    <button id="block-btn">🛡️ BLOCK</button>
    <div id="joy-row">
      <div id="equip-col">
        <button class="ctl-btn" id="btn-gun" data-action="gun">🔫 Gun</button>
        <button class="ctl-btn" id="btn-shield" data-action="shield">🛡 Shield</button>
        <button class="ctl-btn" id="btn-wand" data-action="wand">🪄 Wand</button>
      </div>
      <div id="joystick"><div id="joystick-knob"></div></div>
      <button class="ctl-btn" id="btn-jump" data-action="jump">⬆️<br>Jump</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hostPeerId = params.get('host');

    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connect-btn');
    const gyroDisplay = document.getElementById('gyro-display');
    const connectedIcon = document.getElementById('connected-icon');
    const errorMsg = document.getElementById('error-msg');
    const gyroAlpha = document.getElementById('gyro-alpha');
    const gyroBeta = document.getElementById('gyro-beta');
    const gyroGamma = document.getElementById('gyro-gamma');

    let peer = null;
    let conn = null;
    let gyroEnabled = false;
    let sendInterval = null;
    let lastGyro = { alpha: null, beta: null, gamma: null };
    let isBlocking = false;

    // The bottom bar does what fits the weapon in hand (barMode, from the game's status):
    //   block — sword: blocks while held       fire — gun: fires
    //   sword — shield: back to the sword       shield — wand: shield up while held, wand back on release
    const blockBtn = document.getElementById('block-btn');
    let barMode = 'block';
    let pressMode = null;   // the mode the current press started in
    const sendAction = (action) => {
      if (conn && conn.open) {
        try { conn.send({ type: 'action', action, ts: Date.now() }); } catch (_) { /* ignore */ }
      }
    };
    const setBlocking = (val) => {
      isBlocking = val;
      blockBtn.classList.toggle('blocking', val);
    };
    const pressBar = () => {
      if (pressMode) return;
      pressMode = barMode;
      if (navigator.vibrate && pressMode !== 'block') navigator.vibrate(15);
      if (pressMode === 'block') setBlocking(true);
      else {
        blockBtn.classList.add('pressed');
        if (pressMode === 'fire') sendAction('fire');
        // (Shield again goes back to the sword)
        else if (pressMode === 'sword') sendAction('shield');
        else if (pressMode === 'shield') sendAction('wandShieldDown');
      }
    };
    const releaseBar = () => {
      const mode = pressMode;
      pressMode = null;
      setBlocking(false);
      blockBtn.classList.remove('pressed');
      if (mode === 'shield') sendAction('wandShieldUp');
    };
    blockBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { blockBtn.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      pressBar();
    });
    blockBtn.addEventListener('pointerup', releaseBar);
    blockBtn.addEventListener('pointercancel', releaseBar);
    blockBtn.addEventListener('pointerleave', releaseBar);

    // ── Joystick (angle in radians, 0 = right, π/2 = up; force 0–1) ────────
    const joystickEl = document.getElementById('joystick');
    const joystickKnob = document.getElementById('joystick-knob');
    let joy = { angle: 0, force: 0 };
    let joyPointerId = null;
    const updateJoystick = (e) => {
      const rect = joystickEl.getBoundingClientRect();
      const radius = rect.width / 2;
      let dx = e.clientX - (rect.left + radius);
      let dy = e.clientY - (rect.top + radius);
      const dist = Math.hypot(dx, dy);
      if (dist > radius) { dx *= radius / dist; dy *= radius / dist; }
      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joy = { angle: Math.atan2(-dy, dx), force: Math.min(1, dist / radius) };
    };
    const releaseJoystick = (e) => {
      if (e.pointerId !== joyPointerId) return;
      joyPointerId = null;
      joy = { angle: 0, force: 0 };
      joystickKnob.style.transform = '';
    };
    joystickEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      joyPointerId = e.pointerId;
      try { joystickEl.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      updateJoystick(e);
    });
    joystickEl.addEventListener('pointermove', (e) => {
      if (e.pointerId === joyPointerId) updateJoystick(e);
    });
    joystickEl.addEventListener('pointerup', releaseJoystick);
    joystickEl.addEventListener('pointercancel', releaseJoystick);

    // ── Action buttons: one 'action' message per press ────────────────────
    const actionButtons = Array.from(document.querySelectorAll('.ctl-btn[data-action]'));
    actionButtons.forEach((btn) => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (btn.disabled) return;
        btn.classList.add('pressed');
        if (navigator.vibrate) navigator.vibrate(15);
        sendAction(btn.dataset.action);
      });
      const unpress = () => btn.classList.remove('pressed');
      btn.addEventListener('pointerup', unpress);
      btn.addEventListener('pointercancel', unpress);
      btn.addEventListener('pointerleave', unpress);
    });
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ── Status from the game (counts, owned weapons, what's equipped) ─────
    const btnBomb = document.getElementById('btn-bomb');
    const btnBubble = document.getElementById('btn-bubble');
    const btnGun = document.getElementById('btn-gun');
    const btnShield = document.getElementById('btn-shield');
    const btnWand = document.getElementById('btn-wand');
    function applyStatus(st) {
      document.body.classList.toggle('block-only', !!st.blockOnly);
      btnBomb.textContent = `💣 ${st.bombs ?? 0}`;
      btnBomb.disabled = !(st.bombs > 0);
      btnBubble.textContent = `🫧 ${st.bubbles ?? 0}`;
      btnBubble.disabled = !(st.bubbles > 0) && !st.bubbleActive;
      btnBubble.classList.toggle('active', !!st.bubbleActive);
      // Equip buttons: each toggles its weapon ↔ the sword
      btnGun.disabled = !st.hasGun;
      btnShield.disabled = !st.hasShield;
      btnGun.classList.toggle('equipped', st.equipped === 'pistol');
      btnShield.classList.toggle('equipped', st.equipped === 'shield');
      btnGun.textContent = st.equipped === 'pistol' ? '🗡️ Sword' : '🔫 Gun';
      btnShield.textContent = st.equipped === 'shield' ? '🗡️ Sword' : '🛡 Shield';
      // Magic wand (once owned / picked up): swaps with the sword; shows the mana left
      btnWand.classList.toggle('owned', !!st.hasWand);
      btnWand.classList.toggle('equipped', st.equipped === 'magic_wand');
      btnWand.textContent = st.equipped === 'magic_wand' ? `🗡️ Sword 🔮${st.mana ?? 0}` : `🪄 Wand 🔮${st.mana ?? 0}`;
      // The bottom bar: Fire (gun), Sword (shield), Shield (wand, when a shield is owned), else Block
      const nextMode = st.blockOnly ? 'block'
        : st.equipped === 'pistol' ? 'fire'
        : st.equipped === 'shield' ? (st.wandShieldHeld ? 'shield' : 'sword')
        : st.equipped === 'magic_wand' && st.hasShield ? 'shield'
        : 'block';
      // (a held Block stays a block until it's let go)
      if (nextMode !== barMode && pressMode === 'block') releaseBar();
      barMode = nextMode;
      ['fire', 'sword', 'shield'].forEach((m) => blockBtn.classList.toggle(`mode-${m}`, barMode === m));
      blockBtn.textContent = barMode === 'fire' ? `🔥 FIRE ${st.ammo ?? 0}`
        : barMode === 'sword' ? '🗡️ SWORD'
        : barMode === 'shield' ? '🛡 SHIELD'
        : '🛡️ BLOCK';
      // Tutorial: ring the button the game is asking for
      const highlightTargets = { bomb: btnBomb, bubble: btnBubble, gun: btnGun, shield: btnShield, wand: btnWand };
      Object.entries(highlightTargets).forEach(([name, el]) => {
        el.classList.toggle('tutorial-highlight', st.highlight === name);
      });
      blockBtn.classList.toggle('tutorial-highlight', st.highlight === 'block' || st.highlight === 'fire');
    }

    if (!hostPeerId) {
      statusEl.textContent = 'No host ID in URL. Scan the QR code from the game.';
      connectBtn.disabled = true;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setError(text) {
      errorMsg.textContent = text;
    }

    // Keep the phone's screen on while it is the controller — a sleeping phone stops sending
    // gyro packets and can come back with a jumped compass heading (bad calibration).
    // The browser drops the lock whenever the page is hidden, so it is re-requested when it
    // becomes visible again and on any tap.
    let wakeLock = null;
    async function keepScreenAwake() {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      if (wakeLock && !wakeLock.released) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (_) { wakeLock = null; }
    }
    document.addEventListener('visibilitychange', keepScreenAwake);
    window.addEventListener('pointerdown', keepScreenAwake, { passive: true });
    keepScreenAwake();

    async function requestGyroPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result !== 'granted') throw new Error('Gyroscope permission denied');
      }
    }

    function startGyro() {
      if (gyroEnabled) return; // (already listening — a reconnect)
      window.addEventListener('deviceorientation', (e) => {
        lastGyro.alpha = e.alpha;
        lastGyro.beta = e.beta;
        lastGyro.gamma = e.gamma;
        gyroAlpha.textContent = `α (compass): ${e.alpha !== null ? e.alpha.toFixed(1) + '°' : '—'}`;
        gyroBeta.textContent = `β (tilt fwd/back): ${e.beta !== null ? e.beta.toFixed(1) + '°' : '—'}`;
        gyroGamma.textContent = `γ (tilt left/right): ${e.gamma !== null ? e.gamma.toFixed(1) + '°' : '—'}`;
      }, true);
      gyroEnabled = true;
    }

    function startSendLoop() {
      if (sendInterval) clearInterval(sendInterval);
      // Send at ~30 Hz
      sendInterval = setInterval(() => {
        if (conn && conn.open && gyroEnabled) {
          try {
            conn.send({
              type: 'gyro',
              alpha: lastGyro.alpha,
              beta: lastGyro.beta,
              gamma: lastGyro.gamma,
              blocking: isBlocking,
              joyAngle: joy.angle,
              joyForce: joy.force,
              ts: Date.now()
            });
          } catch (_) { /* ignore */ }
        }
      }, 33);
    }

    connectBtn.addEventListener('click', async () => {
      if (!hostPeerId) return;
      connectBtn.disabled = true;
      setStatus('Requesting permissions…');
      setError('');

      try {
        await requestGyroPermission();
      } catch (e) {
        setError(e.message);
        setStatus('Permission required to use gyroscope');
        connectBtn.disabled = false;
        return;
      }

      setStatus('Connecting to game…');

      // Fetch TURN credentials from the game server so NAT traversal works
      let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
      try {
        const turnRes = await fetch('/api/turn-credentials');
        if (turnRes.ok) {
          const list = await turnRes.json();
          if (Array.isArray(list) && list.length) iceServers = list;
        }
      } catch (_) { /* fall through to STUN-only */ }

      connectToGame(iceServers, 0);
    });

    // The game can be briefly unreachable (its link to the signalling server is reconnecting,
    // e.g. after its tab was in the background) — keep trying for a little while
    const FIND_GAME_RETRIES = 6;
    const FIND_GAME_RETRY_MS = 2500;
    const CONNECT_TIMEOUT_MS = 15000;
    let connectTimer = null;

    function showConnectButton() {
      connectBtn.disabled = false;
      connectBtn.style.display = '';
    }

    function dropConnection() {
      clearTimeout(connectTimer);
      if (sendInterval) { clearInterval(sendInterval); sendInterval = null; }
      if (conn) { try { conn.close(); } catch (_) { /* ignore */ } conn = null; }
      if (peer) { try { peer.destroy(); } catch (_) { /* ignore */ } peer = null; }
    }

    function connectToGame(iceServers, attempt) {
      dropConnection(); // (a stale peer / connection from an earlier try)
      const myPeer = new Peer({ config: { iceServers } });
      peer = myPeer;
      let done = false;
      const fail = (message, retry) => {
        if (done || peer !== myPeer) return;
        done = true;
        dropConnection();
        document.body.classList.remove('controller-mode');
        connectedIcon.style.display = 'none';
        releaseBar();
        if (retry && attempt < FIND_GAME_RETRIES) {
          setStatus(`Looking for the game… (${attempt + 1}/${FIND_GAME_RETRIES})`);
          connectTimer = setTimeout(() => connectToGame(iceServers, attempt + 1), FIND_GAME_RETRY_MS);
          return;
        }
        setError(message);
        setStatus('Failed to connect');
        showConnectButton();
      };

      myPeer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          fail('Could not find the game. Make sure it is open on the other screen, then tap Connect '
            + '(if the game page was reloaded, scan its new QR code).', true);
        } else {
          fail('Connection error: ' + err.message, ['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type));
        }
      });

      myPeer.on('open', () => {
        if (peer !== myPeer) return;
        const myConn = myPeer.connect(hostPeerId, { serialization: 'json' });
        conn = myConn;
        // (a connection that never opens — e.g. ICE fails — would otherwise hang here forever)
        connectTimer = setTimeout(() => {
          if (!myConn.open) fail('Timed out connecting to the game. Tap Connect to try again.', true);
        }, CONNECT_TIMEOUT_MS);

        myConn.on('data', (data) => {
          if (data && data.type === 'status') applyStatus(data);
        });

        myConn.on('open', () => {
          if (conn !== myConn) return;
          clearTimeout(connectTimer);
          setError('');
          setStatus('Connected! Move your phone like a sword.');
          connectedIcon.style.display = 'block';
          gyroDisplay.style.display = 'block';
          connectBtn.style.display = 'none';
          document.body.classList.add('controller-mode');
          startGyro();
          startSendLoop();
          myConn.send({ type: 'gyro_hello', msg: 'Phone Sword connected!' });
        });

        myConn.on('close', () => {
          if (conn !== myConn || done) return;
          done = true;
          dropConnection();
          setStatus('Disconnected from game');
          connectedIcon.style.display = 'none';
          document.body.classList.remove('controller-mode');
          releaseBar();
          showConnectButton();
        });

        myConn.on('error', (err) => {
          if (conn !== myConn) return;
          fail('Data channel error: ' + err.message, false);
        });
      });
    }
  </script>
</body>
